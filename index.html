<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Study · Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #0b0b0b, #1a1a1a, #2a2a2a);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      margin: 0;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(255, 165, 0, 0.08), transparent 50%);
      pointer-events: none;
    }

    #introduction {
      width: 100%;
      max-width: 780px;
      min-height: 260px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 165, 0, 0.35);
      border-radius: 2rem;
      padding: 2.5rem 2.2rem;
      color: #f0eae3;
      font-size: 1.4rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: 0.3px;
      text-align: left;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 180, 40, 0.2) inset;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin: 0 1rem;
      position: relative;
      z-index: 5;
      border-left: 6px solid #ffa500;
      word-break: break-word;
      font-weight: 450;
      color: #ffefd5;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
    }

    #introduction i, #introduction em {
      color: #ffb347;
      font-style: normal;
      font-weight: 500;
    }

    button {
      position: fixed;
      bottom: 2rem;
      padding: 0.9rem 2.2rem;
      border: none;
      border-radius: 3rem;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(255, 165, 0, 0.95);
      color: #111;
      cursor: pointer;
      box-shadow: 0 12px 25px -8px rgba(255, 140, 0, 0.5), 0 0 0 1px rgba(255, 200, 100, 0.6) inset;
      transition: all 0.25s ease;
      backdrop-filter: blur(5px);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      text-transform: uppercase;
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    button:hover {
      background: #ffb347;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 22px 30px -12px #ff8c00, 0 0 0 2px rgba(255, 215, 0, 0.3) inset;
      color: #000;
    }

    button:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 8px 18px -6px #ff8c00;
    }

    #back {
      left: 2rem;
    }

    #next {
      right: 2rem;
    }

    button:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    @media (max-width: 700px) {
      #introduction {
        font-size: 1.15rem;
        padding: 1.8rem 1.5rem;
        min-height: 220px;
        border-radius: 1.8rem;
        border-left-width: 5px;
      }

      button {
        padding: 0.75rem 1.6rem;
        font-size: 0.95rem;
        bottom: 1.2rem;
      }

      #back {
        left: 1rem;
      }

      #next {
        right: 1rem;
      }
    }
    a{text-decoration: none;}

    @media (max-width: 400px) {
      #introduction {
        font-size: 1rem;
        padding: 1.5rem 1.2rem;
      }

      button {
        padding: 0.65rem 1.2rem;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
      }
    }
  </style>
</head>
<body>
  <div id="introduction"></div>

  <button id="back">← Back</button>
  <button id="next">Next →</button>

  <script>
    (function() {
      const nextBtn = document.querySelector("#next");
      const backBtn = document.querySelector("#back");
      const introEle = document.getElementById("introduction");

      const introTexts = [
        `🧮 <strong>Welcome to your math sanctuary, <em>Kalkidan</em>.</strong> ✨<br><br>
        This space was built with one purpose: to make mathematics from grade 9 to 12 feel simple, visual, and even fun. 
        Every lesson, every example, every puzzle is designed so you can learn <em>easily</em> — and actually enjoy the journey.`,

        `💛 <strong>Only for you, Kalkidan.</strong><br><br>
        If you're not Kalkidan, please step away — this little corner of the internet was crafted exclusively for her. 
        But if you <em>are</em> Kalkidan, then this is your personal study space. Made with care, warmth, and a touch of magic 🥰.<br><br>
        I built this because I believe you deserve a place where learning feels like a conversation, not a chore.`,

        `🌟 <strong>More than just a website.</strong><br><br>
        This is only the beginning. Explore, play, and discover how beautiful maths can be. I've poured my heart into every corner — 
        and I truly can't wait to hear what you think.<br><br>
        <em>Your feedback means the world to me, Kalkidan. Enjoy every bit of it! 🥰</em>`
      ];

      let currentIndex = 0;

      function updateUI() {
        introEle.innerHTML = introTexts[currentIndex];

        if (currentIndex === 0) {
          backBtn.style.display = "none";
        } else {
          backBtn.style.display = "flex";
        }

        if (currentIndex === introTexts.length - 1) {
          nextBtn.innerHTML = "<a href='main.html'>Finish ✨</a>";
        } else {
          nextBtn.textContent = "Next →";
        }
      }

      nextBtn.addEventListener("click", () => {
        if (currentIndex === introTexts.length - 1) {
          currentIndex = 0;
          updateUI();
          return;
        }

        if (currentIndex < introTexts.length - 1) {
          currentIndex++;
          updateUI();
        }
      });

      backBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateUI();
        }
      });

      updateUI();
    })();
  </script>
</body>
</html>
